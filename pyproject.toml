[project]
name = "deproj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xqly-stack", email = "112006489+xqly-stack@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dlt>=1.32.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
deproj = "deproj:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
